[package]
name = "lagom_web"
version.workspace = true
edition.workspace = true
description = "Browser entry point for the Lagom compiler and interpreter (wasm32-unknown-unknown via wasm-bindgen)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lagom_diagnostics.workspace = true
lagom_parser.workspace = true
lagom_sema.workspace = true
lagom_hir.workspace = true
lagom_mir.workspace = true
lagom_interp.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the wasm-bindgen CLI version used by scripts/build-web.sh exactly.
wasm-bindgen = "=0.2.129"
