name: release

# Build the `lagom` CLI release artifacts: full matrix on every push to
# main, tags, and manual dispatch. On a `v*` tag the publish job attaches
# the three validated packages, sha256 checksums, and install.sh (the macOS/Linux one-file installer) to a GitHub Release
# (doc 09's tooling story).
#
# install-test then plays the user: nothing but the downloaded package (no
# checkout, no Rust toolchain), executing the release page's printed
# instructions step by step on all three OSes — sha256 verify, unpack, run,
# the day-one flow, the PATH step, and the Uninstall section. Publishing
# waits for it, so a release only appears once its own install guide has
# been run by CI.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Provenance: every release binary records the exact commit it was
      # built from, printed by `lagom version` — a redistributed copy
      # carries its origin and the copyright line with it.
      LAGOM_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the lagom CLI (release)
        run: cargo build --release -p lagom_cli

      - name: Build the runtime rlib for bundling
        # The rlib is rustc-version-specific (E0514 under any other rustc),
        # so the staged runtime also carries its stamp and the snapshot
        # sources — a user whose rustc differs gets a one-time rebuild from
        # the sources (see install-test below for the proof).
        run: cargo build --release -p lagom_rt
        env:
          CARGO_TARGET_DIR: target/lagom-rt

      - name: Smoke-test the CLI
        shell: bash
        # GITHUB_PATH does not apply within the writing step itself, so the
        # freshly built binary is invoked by path here (the validate step
        # below can rely on GITHUB_PATH — it is a separate step).
        run: |
          LAGOM="$(pwd)/target/release/lagom"
          [ "$RUNNER_OS" = "Windows" ] && LAGOM="$(pwd)/target/release/lagom.exe"
          "$LAGOM" version
          "$LAGOM" check validation/smoke.lagom
          "$LAGOM" fmt validation/smoke.lagom
          # Attribution invariants: the binary carries the provenance and
          # the copyright line, and the license travels inside it.
          "$LAGOM" version | grep -q "Copyright (c) 2026 Srihan Yeleswarapu"
          "$LAGOM" license | grep -q "Copyright (c) 2026 Srihan Yeleswarapu"

      - name: Stage the artifact (Windows)
        # Bash staging (pwsh silently skipped the stamp write once), but
        # the *zip itself* must come from Compress-Archive: bsdtar's zip
        # layout makes Windows Explorer's extractor reject the archive
        # ("invalid"), while Info-ZIP unzip reads it fine — only half the
        # users could open it. Compress-Archive is the .NET zipper Explorer
        # itself uses, so it can't disagree with Explorer.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p stage/lib/lagom/deps
          cp target/release/lagom.exe stage/
          cp target/lagom-rt/release/liblagom_rt.rlib stage/lib/lagom/
          cp target/lagom-rt/release/deps/*.rlib stage/lib/lagom/deps/
          rustc --version | tr -d '\r\n' > stage/lib/lagom/rustc.txt
          for c in lagom_diagnostics lagom_ast lagom_sema lagom_hir lagom_mir lagom_rt; do
            mkdir -p stage/lib/lagom/src/$c
            cp crates/$c/src/lib.rs stage/lib/lagom/src/$c/lib.rs
          done
          cp LICENSE.md stage/
      - name: Zip the staged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath lagom-Windows.zip -Force

      - name: Stage the artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p stage/lib/lagom/deps
          cp target/release/lagom stage/
          cp target/lagom-rt/release/liblagom_rt.rlib stage/lib/lagom/
          cp target/lagom-rt/release/deps/*.rlib stage/lib/lagom/deps/
          rustc --version | tr -d '\r\n' > stage/lib/lagom/rustc.txt
          for c in lagom_diagnostics lagom_ast lagom_sema lagom_hir lagom_mir lagom_rt; do
            mkdir -p stage/lib/lagom/src/$c
            cp crates/$c/src/lib.rs stage/lib/lagom/src/$c/lib.rs
          done
          cp LICENSE.md stage/
          tar czf lagom-${{ runner.os }}.tar.gz -C stage .

      - name: Checksum the package (sha256)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) sha256sum lagom-Windows.zip > lagom-Windows.zip.sha256 ;;
            macOS)   sha256sum lagom-macOS.tar.gz > lagom-macOS.tar.gz.sha256 ;;
            Linux)   sha256sum lagom-Linux.tar.gz > lagom-Linux.tar.gz.sha256 ;;
          esac

      - name: Validate the staged artifact
        shell: bash
        # GITHUB_PATH applies to later steps, not the one writing it — so
        # this step both exports the unpacked dir for later steps and calls
        # the unpacked binary by path here.
        run: |
          mkdir clean
          if [ "$RUNNER_OS" = "Windows" ]; then
            unzip -q lagom-Windows.zip -d clean
          else
            tar xzf lagom-${{ runner.os }}.tar.gz -C clean
          fi
          echo "$(pwd)/clean" >> "$GITHUB_PATH"
          LAGOM="$(pwd)/clean/lagom"
          [ "$RUNNER_OS" = "Windows" ] && LAGOM="$(pwd)/clean/lagom.exe"
          # Packaging invariants: the rustc stamp and the snapshot sources
          # must ship, or the fast path silently degrades to a rebuild.
          test -f clean/lib/lagom/rustc.txt
          test -f clean/lib/lagom/liblagom_rt.rlib
          test -f clean/lib/lagom/src/lagom_rt/lib.rs
          "$LAGOM" version
          "$LAGOM" run validation/smoke.lagom
          "$LAGOM" build validation/smoke.lagom -o built-smoke
          ./built-smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lagom-${{ matrix.os }}
          path: |
            lagom-Windows.zip
            lagom-Linux.tar.gz
            lagom-macOS.tar.gz
            lagom-*.sha256
          if-no-files-found: error

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the test suite
        run: cargo test --workspace

      - name: Check demo.md against the real compiler
        # The doc-sync gate (scripts/check_demo.py): runs every documented
        # command and compares its output with the transcript demo.md prints.
        # The script rebuilds the release binary first (freshness), executes
        # every implemented section, and skips only loudly-counted planned/
        # future sections — a mismatch or error exits non-zero, so this job
        # gates on documentation rot exactly as `cargo test` gates on
        # behavior rot.
        run: python scripts/check_demo.py

  install-test:
    name: release-page install (${{ matrix.os }})
    # Play the user from the release page with nothing but the package: no
    # checkout, no Rust toolchain. Every printed instruction is executed —
    # sha256 verify, unpack anywhere, run from the folder, the day-one
    # `lagom new` flow, the warned-about exe-without-lib mistake, and the
    # optional PATH step ("reopen the terminal" = the next step's env).
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download the package for this OS
        uses: actions/download-artifact@v4
        with:
          name: lagom-${{ matrix.os }}

      - name: Verify the download (sha256)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) PKG=lagom-Windows.zip ;;
            macOS)   PKG=lagom-macOS.tar.gz ;;
            Linux)   PKG=lagom-Linux.tar.gz ;;
          esac
          sha256sum -c "$PKG.sha256"

      - name: Unpack anywhere (keep lagom and lib together)
        shell: bash
        run: |
          mkdir -p "$HOME/lagom"
          case "$RUNNER_OS" in
            Windows) unzip -q lagom-Windows.zip -d "$HOME/lagom" ;;
            macOS)   tar xzf lagom-macOS.tar.gz -C "$HOME/lagom" ;;
            Linux)   tar xzf lagom-Linux.tar.gz -C "$HOME/lagom" ;;
          esac
          ls "$HOME/lagom"

      - name: Run from the folder (before any PATH)
        shell: bash
        run: |
          cd "$HOME/lagom"
          [ "$RUNNER_OS" = "Windows" ] && L=./lagom.exe || L=./lagom
          "$L" version
          printf 'say "hello from the package"\n' > smoke.lagom
          "$L" run smoke.lagom | grep "hello from the package"
          "$L" build smoke.lagom -o smoke-built
          ./smoke-built

      - name: Day one (lagom new → cd → lagom run)
        shell: bash
        run: |
          ROOT="$HOME/lagom"
          [ "$RUNNER_OS" = "Windows" ] && L="$ROOT/lagom.exe" || L="$ROOT/lagom"
          # Exactly the page's flow: from any scratch directory the user
          # happens to be in (steps don't share cwd — like a fresh shell).
          mkdir -p "$HOME/projects" && cd "$HOME/projects"
          "$L" new hello
          cd hello
          echo you | "$L" run | grep "Hello, you!"

      - name: A rustc that didn't build the package (snapshot rebuild)
        # The E0514 scenario: the bundled rlib was built by CI's rustc. If
        # this runner's rustc differs, the first run above already rebuilt
        # from the shipped snapshot sources — assert that happened. If the
        # rustcs matched, force the same path by removing the stamp (exactly
        # what a version mismatch makes the driver conclude), rerun, and
        # assert the self-built runtime appears and the run still works.
        shell: bash
        run: |
          cd "$HOME/lagom"
          [ "$RUNNER_OS" = "Windows" ] && L=./lagom.exe || L=./lagom
          if [ ! -f lib/lagom/built/release/liblagom_rt.rlib ]; then
            rm lib/lagom/rustc.txt
            "$L" run smoke.lagom | grep "hello from the package"
          fi
          test -f lib/lagom/built/release/liblagom_rt.rlib
          test -f lib/lagom/built/release/rustc.txt
          # now instant: the self-built runtime is reused
          "$L" run smoke.lagom | grep "hello from the package"

      - name: The warned-about mistake (exe without its lib)
        shell: bash
        run: |
          mkdir -p "$HOME/lagom-bare"
          [ "$RUNNER_OS" = "Windows" ] && BIN=lagom.exe || BIN=lagom
          cp "$HOME/lagom/$BIN" "$HOME/lagom-bare/"
          printf 'say "hi"\n' > "$HOME/lagom-bare/t.lagom"
          if "$HOME/lagom-bare/$BIN" run "$HOME/lagom-bare/t.lagom"; then
            echo "native run worked without the bundled runtime — the lib rule is not enforced"
            exit 1
          fi
          # the interpreter path needs no runtime at all
          "$HOME/lagom-bare/$BIN" run --trace "$HOME/lagom-bare/t.lagom" > /dev/null

      - name: Add the folder to PATH (the page's optional step)
        shell: bash
        run: |
          if command -v cygpath >/dev/null 2>&1; then
            DIR="$(cygpath -w "$HOME/lagom")"
          else
            DIR="$HOME/lagom"
          fi
          echo "$DIR" >> "$GITHUB_PATH"

      - name: Plain lagom from anywhere (the reopened terminal)
        shell: bash
        run: |
          cd "$HOME"
          lagom version
          lagom new hello2
          cd hello2
          echo you | lagom run | grep "Hello, you!"

      - name: Uninstall (the page's Uninstall section)
        # The page's two commands, plan then --yes. The rc line is created
        # exactly as the page's macOS/Linux step writes it so --rc has
        # something real to clean (CI's PATH came from GITHUB_PATH, not an
        # rc file — a Windows PATH never lives in an rc file at all). On
        # Windows the running exe cannot delete itself: the tool removes
        # everything else and names the leftover — asserted as promised.
        shell: bash
        run: |
          [ "$RUNNER_OS" = "Windows" ] && BIN=lagom.exe || BIN=lagom
          cd "$HOME"
          test -f "$HOME/lagom/$BIN"
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo 'export PATH="$PATH:'"$HOME"'/lagom"' >> ~/.zshrc
          fi
          # Plan only: prints, deletes nothing.
          lagom uninstall --rc | grep "nothing was changed"
          test -f "$HOME/lagom/$BIN"
          # Execute.
          if [ "$RUNNER_OS" = "Windows" ]; then
            lagom uninstall --rc --yes | grep "almost done"
            test ! -e "$HOME/lagom/lib"
          else
            lagom uninstall --rc --yes | grep "lagom is uninstalled"
            test ! -e "$HOME/lagom"
          fi
          if [ "$RUNNER_OS" != "Windows" ]; then
            # The rc file was created with exactly one lagom line; it must
            # now contain none (other content, had there been any, stays).
            ! grep -qi lagom ~/.zshrc
          fi

  installer-test:
    name: install.sh (${{ matrix.os }})
    # The one-command installer (install.sh), run on the real OSes it
    # serves: install the latest published release, day-one flow, then
    # uninstall both ways (the CLI's `lagom uninstall --rc --yes` and the
    # script's `--uninstall`), asserting at every step. This is the
    # end-to-end Mac test — a runner is the closest thing to the user's
    # machine the project has.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest published release
        shell: bash
        run: |
          V="$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)"
          echo "installing $V"
          sh install.sh --version "$V"
          test -x "$HOME/.lagom/lagom"
          "$HOME/.lagom/lagom" version

      - name: PATH line landed exactly once
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-latest) RC="$HOME/.zshrc" ;;
            *)            RC="$HOME/.bashrc" ;;
          esac
          grep -F "$HOME/.lagom" "$RC"
          [ "$(grep -cF "$HOME/.lagom" "$RC")" = "1" ]

      - name: Day one (new → run), toolchain-free on the interpreter
        shell: bash
        run: |
          cd "$(mktemp -d)"
          "$HOME/.lagom/lagom" new hello
          cd hello
          echo you | "$HOME/.lagom/lagom" run --trace | grep "Hello, you!"
          if command -v rustc >/dev/null 2>&1; then
            # Native path: the snapshot rebuild makes any rustc work.
            echo you | "$HOME/.lagom/lagom" run | grep "Hello, you!"
          else
            echo "no rustc on this runner — the native-run check is covered by install-test"
          fi

      - name: Uninstall via the script (how older installs are removed)
        # `lagom uninstall` against the *published* binary is deliberately
        # not asserted here: the latest release may predate that command
        # (pre-v0.2.0 releases do). The current binary's CLI uninstall is covered by
        # the install-test job on all three OSes; a published install is
        # removed with install.sh --uninstall, which is what this asserts.
        shell: bash
        run: |
          V="$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)"
          sh install.sh --version "$V" >/dev/null   # reinstall: idempotency
          sh install.sh --uninstall
          test ! -e "$HOME/.lagom"
          case "${{ matrix.os }}" in
            macos-latest) RC="$HOME/.zshrc" ;;
            *)            RC="$HOME/.bashrc" ;;
          esac
          test -f "$RC"
          ! grep -qF "$HOME/.lagom" "$RC"
          echo "install.sh: install → run → uninstall verified end to end"

  installer-test-noclone:
    name: install.sh downloaded from the release (ubuntu-latest)
    # The macOS/Linux promise, played exactly as the README tells it: one
    # file from the release page's Assets (install.sh), then `sh install.sh`
    # — no clone, no checkout. Runs after publish so it downloads the
    # install.sh asset off the release this tag just created; `gh` is used
    # here because the repo is private (curl would 404 without auth).
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download install.sh from the release page (Assets)
        shell: bash
        run: |
          mkdir -p "$HOME/Downloads" && cd "$HOME/Downloads"
          gh release download "${{ github.ref_name }}" -R "${{ github.repository }}" -p install.sh -O install.sh --clobber
          test -f install.sh

      - name: sh install.sh (the whole flow)
        shell: bash
        run: |
          cd "$HOME/Downloads"
          sh install.sh
          test -x "$HOME/.lagom/lagom"
          "$HOME/.lagom/lagom" version

      - name: Day one, then uninstall
        shell: bash
        run: |
          cd "$(mktemp -d)"
          "$HOME/.lagom/lagom" new hello
          cd hello
          echo you | "$HOME/.lagom/lagom" run --trace | grep "Hello, you!"
          sh "$HOME/Downloads/install.sh" --uninstall
          test ! -e "$HOME/.lagom"

  publish:
    name: publish (GitHub Release)
    # Only a tag publishes. Every package was already machine-validated by
    # the build job's "Validate the staged artifact" step, and install-test
    # has executed the release page's instructions end to end on all three
    # OSes — so what lands on the page is proven to work exactly as printed.
    needs: [build, install-test, installer-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the validated packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum the packages
        run: |
          cd dist
          sha256sum lagom-Windows.zip lagom-Linux.tar.gz lagom-macOS.tar.gz > sha256sums.txt
          cat sha256sums.txt

      - name: Sign the packages (build provenance attestation)
        # Cryptographic provenance anyone can verify offline:
        # `gh attestation verify <file> -R Srihan-Yeleswarapu/lagom`
        # proves a package was built by this workflow from this commit.
        # A tampered or re-packaged copy fails verification — that failure
        # is the evidence a takedown needs.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/lagom-Windows.zip
            dist/lagom-Linux.tar.gz
            dist/lagom-macOS.tar.gz

      - name: Build the release notes
        # Stamp the template with the tag name (the template's __VERSION__
        # marker) so every release ships the same install guide.
        run: |
          sed 's/__VERSION__/'"$GITHUB_REF_NAME"'/g' \
            .github/release-notes-template.md > release-notes.md

      - name: Verify install.sh is intact in the checkout
        # install.sh itself ships as a release asset (the macOS/Linux
        # one-file installer), so a corrupted or CRLF-mangled copy would
        # poison every future install. Check the invariants before upload.
        shell: bash
        run: |
          test -f install.sh
          test -f LICENSE.md
          grep -q "Copyright (c) 2026 Srihan Yeleswarapu" LICENSE.md
          ! grep -q $'\r' install.sh
          test "$(git check-attr eol -- install.sh | sed 's/.*eol: //')" = "lf"
          sh -n install.sh

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Explicit assets: the per-OS *.sha256 files stay out of the page
          # (the combined sha256sums.txt is the one checksum file users see).
          gh release create "$GITHUB_REF_NAME" install.sh LICENSE.md \
            dist/lagom-Windows.zip dist/lagom-Linux.tar.gz dist/lagom-macOS.tar.gz dist/sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lagom $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            || gh release upload "$GITHUB_REF_NAME" \
              dist/lagom-Windows.zip dist/lagom-Linux.tar.gz dist/lagom-macOS.tar.gz dist/sha256sums.txt \
              install.sh LICENSE.md --clobber --repo "$GITHUB_REPOSITORY"
